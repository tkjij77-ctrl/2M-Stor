name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # ✅ تشغيل يدوي من تبويب Actions (يفيد لاختبار الفرع قبل الدمج)
  workflow_dispatch:

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run typecheck
      # ✅ T2.3: صحة ملفات الـworkflow نفسها (كان خطأ صياغة واحد يعطّل كل CI بصمت)
      # ⚠️ action-validator يأخذ ملفًا واحدًا لكل استدعاء — تمرير ثلاثة معًا
      # كان يُطبع «Usage» ويفشل المهمة بلا فحص أي ملف.
      - name: التحقق من صيغة ملفات GitHub Actions
        run: |
          for f in .github/workflows/*.yml; do
            echo "── فحص $f"
            npx --yes @action-validator/cli "$f"
          done
      # فحصنا الخاص: يلتقط ما لا يلتقطه action-validator (مثل secrets داخل if)
      - name: فحص إعداد CI/Dependabot/CodeQL
        run: python3 scripts/verify-ci-config.py
      # ADR-0001: لا سطح محمي وسطح مكشوف — الترويسات يجب أن تتطابق
      - name: تطابق ترويسات الأمان بين السطح الثابت والـNext
        run: node scripts/verify-static-headers.js
      # T7.4: سقف المعالجات المضمّنة لا يزيد (onclick → data-act)
      - name: سقف المعالجات المضمّنة (لا نموّ للدَّين التقني)
        run: node scripts/verify-inline-handlers.js

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run test

  # ✅ T2.2: مهمة البناء — كانت غائبة تمامًا، ولهذا لم يُكشف أن next build يفشل
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # ✅ إصلاح: كان البناء يفشل في CI لغياب أسرار المستودع
      # ("Your project's URL and API key are required") — الآن نستخدم بدائل
      # صريحة عند غياب السر، والبناء يبقى فحصًا حقيقيًا للكود لا للأسرار.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://ci-placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'ci-placeholder-key' }}

  # ✅ T2.3: بوابة ثغرات الحزم — كانت 12 ثغرة (منها 1 حرجة) تمر بلا أن يلاحظها أحد
  # لأن لا شيء كان يفحص التبعيات. تمنع عودة العدد للارتفاع.
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: فحص ثغرات الحزم (عالي وحرج يُفشل المهمة)
        run: npm audit --audit-level=high

  # ℹ️ يحتاج SUPABASE_ACCESS_TOKEN (وSUPABASE_DB_PASSWORD عند وجود كلمة مرور قاعدة)
  # ✅ إصلاح: كانت المهمة تفشل عند غياب الأسرار. الآن تُتخطّى بوضوح بدل الفشل
  # الصامت، ومع وجود الأسرار تعمل فعليًا على قاعدة مرتبطة.
  supabase-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: gate
        name: هل أسرار Supabase متاحة؟
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then echo "run=yes" >> "$GITHUB_OUTPUT"; else echo "run=no" >> "$GITHUB_OUTPUT"; fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - uses: supabase/setup-cli@v1
        if: steps.gate.outputs.run == 'yes'
        with: { version: latest }
      - run: supabase db lint --linked --level warning
        if: steps.gate.outputs.run == 'yes'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - if: steps.gate.outputs.run == 'no'
        run: echo "ℹ️ لا SUPABASE_ACCESS_TOKEN — تُخطّيت المهمة. أضِفه من Settings ← Secrets ← Actions"
      # بديل يعمل بلا أسرار: فحص الانحراف بين الترحيلات والكود
      - run: node scripts/verify-schema-drift.js --repo

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps
      # ⚠️ لا يمكن استخدام secrets داخل if إطلاقًا — GitHub يرفض الملف كله
      # عند الفحص ("Unrecognized named-value: secrets") ويفشل التشغيل قبل
      # إنشاء أي مهمة. الحل المطابق: بوابة تكتب النتيجة في GITHUB_OUTPUT.
      - id: gate
        name: هل متغيرات Supabase العامة متاحة؟
        run: |
          if [ -n "$NEXT_PUBLIC_SUPABASE_URL" ]; then echo "run=yes" >> "$GITHUB_OUTPUT"; else echo "run=no" >> "$GITHUB_OUTPUT"; fi
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://ci-placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'ci-placeholder-key' }}
      # E2E حقيقي يحتاج قاعدة حيّة — يُتخطّى بوضوح بدل الفشل عند غياب الأسرار
      - if: steps.gate.outputs.run == 'yes'
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      - if: steps.gate.outputs.run == 'no'
        run: echo "ℹ️ لا أسرار Supabase — تُخطّيت اختبارات E2E. أضِفها من Settings ← Secrets ← Actions" 

  # ═══════════════════════════════════════════════════════════════════════════
  #  🔒 T7.1 (2026-11-07) — بوابة قاعدة البيانات: كانت الفحوصات الحقيقية
  #  (RLS · دوال المخزون · إسقاطات القراءة SEC-1/SEC-2) تعمل **محليًا فقط**.
  #  أي تعديل على سياسة أو صلاحية كان يمرّ إلى الإنتاج بلا فحص — وهو أخطر ما
  #  يمكن أن يحدث لثغرة أُغلقت بالفعل. هذه المهمة تبني النظام من الصفر على
  #  PostgreSQL 17 حقيقي وتُفشل الـPR عند أي انحدار.
  # ═══════════════════════════════════════════════════════════════════════════
  db-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # نفس الإصدار المُختبَر محليًا (17) — لا نفترض أن سلوك RLS/الدوال واحد على 14
      - name: تثبيت PostgreSQL 17
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-17 postgresql-client-17
      - name: تشغيل الخادم
        run: sudo service postgresql start
      # pg_net غير متاح خارج Supabase — بلا المحاكي لا يُبنى النظام كاملًا
      - name: محاكي pg_net (بلا شبكة)
        run: bash scripts/pg-net-stub.sh
      - name: بناء النظام من الصفر + RLS + المخزون + SEC-1/SEC-2
        run: bash scripts/verify-sql-live.sh

  # ═══════════════════════════════════════════════════════════════════════════
  #  🔒 T7.2 — بوابة الواجهة في متصفح حقيقي:
  #   • المتجر لا يطلب جدول items الخام ولا يعرض أرقام مخزون (SEC-1)
  #   • زر الحفظ يستدعي upsert_item ولا يكتب على الجدول (SEC-2)
  #   • مسار /admin محمي فعليًا (تحويل لا مجرد وجود middleware)
  # ═══════════════════════════════════════════════════════════════════════════
  ui-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: التطبيق الرئيسي — SEC-1 · SEC-2 في متصفح حقيقي
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/static.log 2>&1 &
          sleep 1
          node scripts/verify-stock-projection-ui.js
          # T7.4: الموزّع يُنفّذ السلوك فعلًا (لا مجرد غياب onclick)
          node scripts/verify-actions-dispatch.js
          # T7.4: لوحة الإدارة (104 معالجًا حُوِّل) تُستعمل فعلًا في المتصفح
          node scripts/verify-pro-admin-ui.js
      - name: بناء Next.js (بلا أسرار — قيم بديلة)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://ci-placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'ci-placeholder-key' }}
      - name: حماية /admin + ترويسات الأمان (خادم إنتاجي حقيقي)
        run: |
          npx next start -H 127.0.0.1 -p 3100 >/tmp/next.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:3100/ && break; sleep 1; done
          APP_URL=http://127.0.0.1:3100 node scripts/verify-next-admin-guard.js
          # عند الفشل: اطبع سجل الخادم ليظهر السبب في تبويب Actions
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://ci-placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'ci-placeholder-key' }}
      - name: سجل خادم Next عند الفشل
        if: failure()
        run: tail -50 /tmp/next.log || true
