name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run typecheck
      # ✅ T2.3: صحة ملفات الـworkflow نفسها (كان خطأ صياغة واحد يعطّل كل CI بصمت)
      - name: التحقق من صيغة ملفات GitHub Actions
        run: npx --yes @action-validator/cli .github/workflows/ci.yml .github/workflows/codeql.yml .github/workflows/backup.yml

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run test

  # ✅ T2.2: مهمة البناء — كانت غائبة تمامًا، ولهذا لم يُكشف أن next build يفشل
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

  # ✅ T2.3: بوابة ثغرات الحزم — كانت 12 ثغرة (منها 1 حرجة) تمر بلا أن يلاحظها أحد
  # لأن لا شيء كان يفحص التبعيات. تمنع عودة العدد للارتفاع.
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: فحص ثغرات الحزم (عالي وحرج يُفشل المهمة)
        run: npm audit --audit-level=high

  # ℹ️ يحتاج SUPABASE_ACCESS_TOKEN و SUPABASE_DB_PASSWORD كأسرار للمستودع
  # وإلا يفشل — ولذلك continue-on-error حتى تضبط الأسرار
  supabase-lint:
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: supabase db lint --linked
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npm run build
      - run: npm run test:e2e
