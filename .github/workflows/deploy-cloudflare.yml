name: Deploy · Cloudflare Workers (Static Assets)

# ADR-0001 — نشر السطح الثابت (index.html + web/ + vendor/) على Cloudflare.
#
# • الهدف: Worker بموارد ثابتة، لا Pages. السبب: هو ما أنشأه الرفع الحيّ فعلًا،
#   وهو المسار الذي يتبنّاه Cloudflare حاليًا (Pages = «legacy workflow»).
# • الإعداد في wrangler.jsonc (اسم العامل + مجلد الأصول). لا كود تطبيق هنا.
# • بلا أسرار: المهمة تُتخطّى بهدوء بدل أن تفشل (النشر لا يكسر CI).
# • قبل النشر: فحص تطابق الترويسات، فلا تُنشر واجهة بلا CSP.
#
# المطلوب منك مرة واحدة (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   (صلاحية Workers Scripts: Edit + Account: Read)
#   CLOUDFLARE_ACCOUNT_ID
# ويجب أن يكون اسم العامل في Cloudflare هو نفسه "name" في wrangler.jsonc.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      # secrets داخل if يُبطل الـworkflow كله — لذلك نمرّ بمتغيّر بيئة (درس T2.3)
      - name: هل أسرار Cloudflare متاحة؟
        id: gate
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ تخطّي النشر: أضف CLOUDFLARE_API_TOKEN و CLOUDFLARE_ACCOUNT_ID — راجع docs/adr/0001-surfaces-and-hosting.md"
          fi

      - name: فحص الترويسات قبل النشر (لا واجهة بلا CSP)
        run: node scripts/verify-static-headers.js

      - name: تجهيز مجلد النشر (ملفات السطح الثابت فقط)
        run: |
          mkdir -p _site
          cp -v index.html sw.js manifest.json _headers _site/
          cp -v favicon.ico icon-192.png icon-512.png apple-touch-icon.png _site/ 2>/dev/null || true
          cp -rv web vendor _site/
          echo "── حجم ما سيُنشر:"
          du -sh _site
          echo "── ملفات: $(find _site -type f | wc -l)"

      - name: نشر على Cloudflare Workers (بلا بناء)
        if: steps.gate.outputs.ready == 'true'
        run: |
          npx --yes wrangler@4 deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: ما بقي بعد النشر
        if: steps.gate.outputs.ready != 'true'
        run: echo "⚠️ لم يُنشر شيء — الأسرار غائبة. النسخة الحيّة ما زالت تعمل، لا خطر."
